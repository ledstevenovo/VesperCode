# T35.1 legacy step 35.A: GitHub Actions verification workflow.
#
# Every push and every pull request runs the three exact verification jobs
# (unit-test, reference-image-build, demo-image-build, SPEC §8.4) on the
# GitHub-hosted Linux runner with Docker (SPEC §10.3), read-only
# permissions, locked setup, deterministic commands, saved
# reports/artifacts and no publishing credential or action.  Fork pull
# requests are secretless and still complete the full three-job closure;
# there is no skip path and no remote query happens from this file.
#
# Locked dependencies: requirements/dev.lock pins every package with
# sha256 hashes recorded from the Windows formal environment.  On the
# Linux runner the seven packages that publish platform wheels
# (ast-serialize, charset-normalizer, librt, markupsafe, mypy,
# pydantic-core, ruff) are installed first at the exact lock versions
# with --no-deps (their Windows-artifact hashes do not transfer); the
# remaining 37 pure-Python packages are then installed with the original
# hash-locked file and --no-deps, matching the formal bootstrap's flat
# lock closure (bootstrap_formal_env.py installs dev.lock with --no-deps,
# so Linux-only conditional deps like keyring's SecretStorage never enter
# the resolution); the Windows-only pywin32 lines are excluded.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked Linux development dependencies
        run: python -m pip install --no-deps $(grep -E '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff)==' requirements/dev.lock | cut -d' ' -f1) && grep -vE '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff|pywin32|pywin32-ctypes)==' requirements/dev.lock > /tmp/dev-lock-linux.txt && python -m pip install --require-hashes --no-deps -r /tmp/dev-lock-linux.txt
      # The offline suite includes the docker-feasibility tests
      # (loopback registry round-trip and the real reference gate), which
      # require the frozen buildx 0.30.1 toolchain.
      - uses: docker/setup-buildx-action@v3
        with:
          version: "v0.30.1"
      - name: Run offline unit test suite and save the report
        # tests/integration/windows is the dedicated Windows integration
        # environment (SPEC §10.3; win32cred/win32api module imports cannot
        # be collected on the Linux runner) and is excluded explicitly;
        # it stays fully covered by the GitLab Windows runner and the
        # local formal environment.
        run: python -m pytest -q --ignore=tests/integration/windows --junitxml=tests/.tmp/unit-test-report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/.tmp/unit-test-report.xml
          if-no-files-found: error
          retention-days: 30

  reference-image-build:
    name: reference-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - uses: docker/setup-buildx-action@v3
        with:
          version: "v0.30.1"
      - name: Install locked Linux development dependencies
        run: python -m pip install --no-deps $(grep -E '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff)==' requirements/dev.lock | cut -d' ' -f1) && grep -vE '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff|pywin32|pywin32-ctypes)==' requirements/dev.lock > /tmp/dev-lock-linux.txt && python -m pip install --require-hashes --no-deps -r /tmp/dev-lock-linux.txt
      - name: Reproduce the frozen reference image and run the fixture smoke
        run: PYTHONPATH=src python scripts/run_reference_image_smoke.py --report tests/.tmp/reference-image-smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-image-smoke-report
          path: tests/.tmp/reference-image-smoke-report.json
          if-no-files-found: error
          retention-days: 30

  demo-image-build:
    name: demo-image-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install locked Linux development dependencies
        run: python -m pip install --no-deps $(grep -E '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff)==' requirements/dev.lock | cut -d' ' -f1) && grep -vE '^(ast-serialize|charset-normalizer|librt|markupsafe|mypy|pydantic-core|ruff|pywin32|pywin32-ctypes)==' requirements/dev.lock > /tmp/dev-lock-linux.txt && python -m pip install --require-hashes --no-deps -r /tmp/dev-lock-linux.txt
      - name: Build the demo image and run the health and isolation smoke
        run: PYTHONPATH=src python scripts/run_demo_image_smoke.py --report tests/.tmp/demo-image-smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-image-smoke-report
          path: tests/.tmp/demo-image-smoke-report.json
          if-no-files-found: error
          retention-days: 30
