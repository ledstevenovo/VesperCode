name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TUI test dependencies
        run: pip install textual==8.2.8
      - name: Run v2 offline unit test suite
        run: PYTHONPATH=src python -m unittest discover -s tests/unit/v2 -v
