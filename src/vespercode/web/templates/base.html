<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VesperCode 本地 WebUI{% endblock %}</title>
<style>
  /* Sufficient contrast: dark text on a light background and a
     light-on-dark banner (WCAG AA); status is never color-only (the
     badge always carries exact text plus a non-color cue). */
  :root {
    color-scheme: light dark;
    --text: #1a1a1a;
    --background: #f7f5f0;
    --banner-bg: #101418;
    --banner-text: #ffffff;
    --accent: #005a9e;
    --border: #444444;
    --error-bg: #fdecec;
    --error-text: #8a1f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--background);
    line-height: 1.5;
  }
  header.app-banner {
    background: var(--banner-bg);
    color: var(--banner-text);
    padding: 0.75rem 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  /* Keyboard reachability: every interactive control is a native
     button with a visible focus ring. */
  button {
    font: inherit;
    padding: 0.5rem 1rem;
    margin: 0.25rem 0.25rem 0.25rem 0;
    border: 1px solid var(--border);
    border-radius: 0.25rem;
    background: #ffffff;
    color: var(--text);
    cursor: pointer;
  }
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .status-badge {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.25rem;
    background: #ffffff;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-dot {
    display: inline-block;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    margin-right: 0.35rem;
    background: var(--border);
    vertical-align: baseline;
  }
  .live-error {
    min-height: 1.5rem;
    margin: 1rem 0;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--error-text);
    border-radius: 0.25rem;
    background: var(--error-bg);
    color: var(--error-text);
    font-weight: 700;
  }
  .run-list { list-style: none; padding: 0; }
  .run-item {
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
  }
  .run-id {
    font-family: ui-monospace, Consolas, monospace;
    margin-right: 0.75rem;
    overflow-wrap: anywhere;
  }
  /* Reduced motion: no animation or transition when requested. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<header class="app-banner" role="banner">VesperCode 本地控制台 — 仅绑定 127.0.0.1</header>
<main id="content">
{% block content %}{% endblock %}
</main>
<div id="live-error" aria-live="assertive" role="alert" class="live-error"></div>
<script src="/static/htmx.min.js"></script>
<script nonce="{{ csp_nonce }}">
  // Live-error hook: every htmx failure lands in the assertive live
  // region as text (never HTML).  The script is allowed only through the
  // per-request CSP nonce — there is no unsafe-inline script bypass.
  (function () {
    "use strict";
    var errorRegion = document.getElementById("live-error");
    function showError(message) {
      errorRegion.textContent = "错误：" + message;
    }
    document.body.addEventListener("htmx:responseError", function (event) {
      var status = event.detail.xhr ? event.detail.xhr.status : "网络错误";
      showError("请求失败（状态 " + status + "）。请刷新页面后重试。");
    });
    document.body.addEventListener("htmx:sendError", function () {
      showError("无法连接本机服务，请确认服务仍在运行。");
    });
  })();
</script>
</body>
</html>
